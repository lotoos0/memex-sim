name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The A/B regression compiles the pinned baseline commit.

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: QA market baseline and OHLC contracts
        run: npm run qa:sim:market-baseline:check

      - name: QA Final Stretch A/B isolation and regressions
        run: npm run qa:sim:buy-bias-ab:check

      - name: QA sim dead floor
        run: npm run qa:sim:dead-floor

      - name: QA sim quick limit
        run: npm run qa:sim:quick-limit
